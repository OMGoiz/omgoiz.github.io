<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>SPACE ATACK - Canvas Only</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
  html,body { height:100%; margin:0; background:#000; overflow:hidden; }
  canvas { display:block; background:#02020a; width:100%; height:100%; }
  #ui {
    position: absolute; left:12px; top:12px;
    color:#bfeeee; font-family: "Consolas",monospace; font-size:14px;
    background: rgba(0,0,0,0.4); padding:8px 10px; border-radius:8px;
    border: 1px solid rgba(255,255,255,0.04);
  }
  #centerNotice {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    color:#fff; font-family:Arial; background: rgba(0,0,0,0.7); padding:16px 20px;border-radius:8px;
    text-align:center; white-space:pre-line;
  }
  #controls { font-size:12px; color:#9ef; margin-top:6px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  Vidas: <span id="lives">5</span> — Score: <span id="score">0</span> — Tiempo: <span id="time">0</span>s<br/>
  Power: <span id="power">Ninguno</span> — Bosses: <span id="bosscount">0</span>
  <div id="controls">Controles: W A S D — Mover • SPACE — Disparar • ENTER — Iniciar/Pausa</div>
</div>
<div id="centerNotice">SPACE ATACK\nPresiona ENTER para empezar</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  let W = canvas.width = innerWidth;
  let H = canvas.height = innerHeight;
  window.addEventListener('resize', ()=>{ W = canvas.width = innerWidth; H = canvas.height = innerHeight; });

  // UI
  const livesEl = document.getElementById('lives');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const powerEl = document.getElementById('power');
  const bossCountEl = document.getElementById('bosscount');
  const centerNotice = document.getElementById('centerNotice');

  // State
  let running = false;
  let paused = false;
  let lastTS = 0;
  let elapsed = 0; // seconds
  let score = 0;
  let lives = 5;
  let globalSpeed = 1.0;
  let bossesDefeated = 0;

  // Player
  const player = {
    x: W/2, y: H*0.75, r: 20, angle: 0,
    speed: 320,
    vx:0, vy:0,
    alive: true,
    fireNext: 0,
    fireRate: 220, // ms
    power: null,
    poweredUntil: 0,
    invulnerableUntil: 0
  };

  // Walls dynamic
  let leftLimit = 24;
  let rightLimit = W - 24;
  let wallTimer = 0;
  let wallInterval = 10000 + Math.random()*8000;

  // Entities
  const stars = [];
  const asteroids = []; // {x,y,vx,vy,rot,rotSpeed,points,size}
  const obstacles = []; // irrompibles {x,y,w,h,vy}
  const bullets = []; // player bullets {x,y,vx,vy,r}
  const enemyBullets = [];
  const machines = []; // {x,y,vx,vy,r,hp,shootTimer}
  const bosses = []; // boss objects
  const powerups = []; // {x,y,vy,type,spawnedTS}

  // Timers
  let asteroidTimer = 0;
  const ASTEROID_INTERVAL = 5000;
  let machineTimer = 0;
  const MACHINE_INTERVAL = 20000;
  let powerupTimerAcc = 0;
  let nextPowerupTime = 10000 + Math.random()*10000;
  let bossSpawned = false;

  // Config
  const MAX_LIVES = 5;
  const AST_BASE_SPEED = 60;

  // Input
  const keys = {};
  window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (e.code === 'Space') keys[' '] = true;

  if (e.key === 'Enter') {
    if (!running) {
      startGame();
    } else {
      paused = !paused;
      if (!paused) {
        lastTS = performance.now();
        requestAnimationFrame(loop);
        centerNotice.style.display = 'none';
      } else {
        centerNotice.style.display = 'block';
        centerNotice.textContent = 'PAUSADO\nPresiona ENTER para continuar';
      }
    }
  }

  if (e.code === 'Space') e.preventDefault();
});

  window.addEventListener('keyup', (e)=> {
    const k = e.key.toLowerCase();
    keys[k] = false;
    if (e.code === 'Space') keys[' '] = false;
  });

  // Generate background stars
  for (let i=0;i<180;i++){
    stars.push({ x: Math.random()*W, y: Math.random()*H, z: Math.random()*1.3+0.3, s: Math.random()*1.8+0.6 });
  }

  // Helpers
  function rand(min,max){ return Math.random()*(max-min)+min; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function dist2(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return dx*dx+dy*dy; }
  function circleColl(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return dx*dx+dy*dy <= (a.r+b.r)*(a.r+b.r); }

  // Asteroid shape generator
  function makeAsteroidPoints(radius) {
    const verts = Math.floor(rand(8, 14));
    const pts = [];
    for (let i=0;i<verts;i++){
      const angle = (Math.PI*2/verts)*i;
      const r = radius * (0.65 + Math.random()*0.45);
      pts.push({ x: Math.cos(angle)*r, y: Math.sin(angle)*r });
    }
    return pts;
  }

  // Spawn functions
  function spawnAsteroid(size=null, x=null, y=null, vx=null, vy=null) {
    // size: 'L','M','S' or random
    const s = size || (Math.random() < 0.18 ? 'L' : (Math.random() < 0.45 ? 'M' : 'S'));
    const radius = s === 'L' ? 44 : s === 'M' ? 26 : 14;
    const px = x !== null ? x : rand(leftLimit + radius + 10, rightLimit - radius - 10);
    const py = y !== null ? y : -80 - rand(0,220);
    const speed = AST_BASE_SPEED * (s === 'L' ? 0.6 : s === 'M' ? 0.95 : 1.25) * globalSpeed;
    const vx0 = vx !== null ? vx : rand(-70,70);
    const vy0 = vy !== null ? vy : speed + rand(-30,30);
    asteroids.push({
      x: px, y: py, vx: vx0, vy: vy0,
      rot: rand(0,Math.PI*2), rotSpeed: rand(-1.2,1.2),
      points: makeAsteroidPoints(radius),
      r: radius,
      size: s
    });
  }

  function spawnObstacle() {
    const w = rand(48, 120); const h = rand(22, 62);
    const x = rand(leftLimit + 10, rightLimit - w - 10);
    const y = -rand(120, 420);
    obstacles.push({ x, y, w, h, vy: 70 * globalSpeed });
  }

  function spawnMachine() {
    const x = rand(leftLimit + 60, rightLimit - 60);
    machines.push({
      x, y: -60, vx: rand(-90,90), vy: rand(20,60),
      r: 18, hp: 3, shootTimer: rand(600,2200)
    });
  }

  function spawnPowerup() {
    const types = ['shield','triple','rapid'];
    const t = types[Math.floor(Math.random()*types.length)];
    const x = rand(leftLimit + 36, rightLimit - 36);
    powerups.push({ x, y: -40, vy: 80*globalSpeed, type: t, spawnTS: performance.now() });
  }

  function spawnBoss() {
    const b = {
      x: W/2, y: -260, r: 90, vx: 0, vy: 60,
      hp: 50, machineTimer: 0, laserTimer: 0, laserActive: false, laserEndTS: 0,
      shootTimer: 0
    };
    bosses.push(b);
    bossSpawned = true;
  }

  // Player shooting
  function playerShoot() {
    if (!player.alive) return;
    const now = performance.now();
    if (now < player.fireNext) return;
    let rate = player.fireRate;
    if (player.power === 'rapid' && now < player.poweredUntil) rate = 120;
    player.fireNext = now + rate;
    const px = player.x, py = player.y - player.r - 6;
    if (player.power === 'triple' && now < player.poweredUntil) {
      bullets.push({ x: px, y: py, vx:-140, vy:-520, r:4 });
      bullets.push({ x: px, y: py, vx:0, vy:-640, r:4 });
      bullets.push({ x: px, y: py, vx:140, vy:-520, r:4 });
    } else {
      bullets.push({ x: px, y: py, vx:0, vy:-720, r:4 });
    }
  }

  // Fragment asteroid when hit
  function fragmentAsteroid(idx) {
    const a = asteroids[idx];
    if (!a) return;
    if (a.size === 'L') {
      for (let i=0;i<3;i++){
        const vx = rand(-180,180);
        const vy = rand(80,260);
        spawnAsteroid('M', a.x + rand(-8,8), a.y + rand(-8,8), vx, vy);
      }
      score += 10;
    } else if (a.size === 'M') {
      for (let i=0;i<3;i++){
        const vx = rand(-240,240);
        const vy = rand(120,300);
        spawnAsteroid('S', a.x + rand(-6,6), a.y + rand(-6,6), vx, vy);
      }
      score += 10;
    } else {
      // S
      score += 10;
    }
    asteroids.splice(idx,1);
  }

  function playerDie() {
    if (performance.now() < player.invulnerableUntil) return;
    lives--;
    livesEl.textContent = lives;
    player.alive = false;
    player.invulnerableUntil = performance.now() + 1500;
    // respawn delay
    setTimeout(()=> {
      if (lives <= 0) { endGame(); return; }
      player.x = W/2; player.y = H*0.75;
      player.alive = true;
      // brief invul
      player.invulnerableUntil = performance.now() + 1200;
    }, 700);
  }

  function endGame() {
    running = false;
    centerNotice.style.display = 'block';
    centerNotice.textContent = `GAME OVER\nScore: ${Math.floor(score)}\nPresiona ENTER para reiniciar`;
  }

  function startGame() {
    // reset state
    asteroids.length = machines.length = bullets.length = enemyBullets.length = bosses.length = obstacles.length = powerups.length = 0;
    stars.length = 0;
    for (let i=0;i<160;i++) stars.push({ x: Math.random()*W, y: Math.random()*H, z: Math.random()*1.3+0.3, s: Math.random()*1.8+0.6 });
    score = 0; scoreEl.textContent = score;
    elapsed = 0; timeEl.textContent = 0;
    lives = MAX_LIVES; livesEl.textContent = lives;
    player.x = W/2; player.y = H*0.75; player.alive = true; player.power = null; player.poweredUntil = 0;
    player.invulnerableUntil = 0; player.fireNext = 0;
    globalSpeed = 1.0; bossesDefeated = 0; bossCountEl.textContent = bossesDefeated;
    asteroidTimer = 0; machineTimer = 0; powerupTimerAcc = 0; nextPowerupTime = 15000 + Math.random()*10000;
    bossSpawned = false;
    wallTimer = 0; wallInterval = 10000 + Math.random()*8000;
    leftLimit = 24; rightLimit = W - 24;
    centerNotice.style.display = 'none';
    running = true;
    paused = false;
    lastTS = performance.now();
    requestAnimationFrame(loop);
  }

  function togglePause() {
    running = !running;
    if (running) {
      centerNotice.style.display = 'none';
      lastTS = performance.now();
      requestAnimationFrame(loop);
    } else {
      centerNotice.style.display = 'block';
      centerNotice.textContent = 'PAUSADO\nPresiona ENTER para continuar';
    }
  }

  // Update logic
  function update(dt) {
    if (!running) return;

    // update global timers
    asteroidTimer += dt;
    machineTimer += dt;
    powerupTimerAcc += dt;

    // elapsed (seconds)
    elapsed += dt/1000;
    timeEl.textContent = Math.floor(elapsed);

    // +1 score per second
    score += dt/1000;
    // round update display
    scoreEl.textContent = Math.floor(score);

    // dynamic walls change
    wallTimer += dt;
    if (wallTimer > wallInterval) {
      wallTimer = 0;
      wallInterval = 9000 + Math.random()*9000;
      // randomly move left or right limit inward/outward
      if (Math.random() < 0.5) {
        // left
        if (Math.random() < 0.6) leftLimit = clamp(leftLimit + rand(28,120), 6, W/2 - 80);
        else leftLimit = clamp(leftLimit - rand(28,120), 6, W/2 - 80);
      } else {
        if (Math.random() < 0.6) rightLimit = clamp(rightLimit - rand(28,120), W/2 + 80, W-6);
        else rightLimit = clamp(rightLimit + rand(28,120), W/2 + 80, W-6);
      }
    }

    // spawn asteroids every 5s (grouped 1-3)
    if (asteroidTimer >= ASTEROID_INTERVAL) {
      asteroidTimer = 0;
      const n = Math.floor(rand(1,4));
      for (let i=0;i<n;i++) spawnAsteroid(null, rand(leftLimit+40, rightLimit-40));
      // chance obstacle
      if (Math.random() < 0.28) spawnObstacle();
    }

    // spawn machines every 20s
    if (machineTimer >= MACHINE_INTERVAL) {
      machineTimer = 0;
      // spawn 1-2
      const mcount = Math.random()<0.5 ? 1 : 2;
      for (let i=0;i<mcount;i++) spawnMachine();
    }

    // powerups spawn logic robust
    if (powerupTimerAcc >= nextPowerupTime) {
      powerupTimerAcc = 0;
      nextPowerupTime = 10000 + Math.random()*10000;
      spawnPowerup();
    }

    // boss spawn at 60s if not spawned
    if (elapsed >= 60 && !bossSpawned) {
      spawnBoss();
    }

    // Update stars
    for (let s of stars) {
      s.y += 30 * s.z * globalSpeed * dt/1000;
      if (s.y > H) { s.y = -2; s.x = Math.random()*W; }
    }

    // Player input and movement
    let mx = 0, my = 0;
    if (keys['w'] || keys['arrowup']) my -= 1;
    if (keys['s'] || keys['arrowdown']) my += 1;
    if (keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    const mag = Math.hypot(mx,my) || 1;
    player.vx = (mx/mag) * player.speed;
    player.vy = (my/mag) * player.speed;
    player.x += player.vx * dt/1000;
    player.y += player.vy * dt/1000;
    // clamp to walls and vertical bounds
    player.x = clamp(player.x, leftLimit + player.r + 4, rightLimit - player.r - 4);
    player.y = clamp(player.y, 60, H - 30);

    // shoot
    if (keys[' '] || keys['space']) playerShoot();

    // Update bullets
    for (let i=bullets.length-1;i>=0;i--) {
      const b = bullets[i];
      b.x += b.vx * dt/1000;
      b.y += b.vy * dt/1000;
      if (b.y < -80 || b.x < -120 || b.x > W+120) bullets.splice(i,1);
    }

    // enemy bullets
    for (let i=enemyBullets.length-1;i>=0;i--) {
      const b = enemyBullets[i];
      b.x += b.vx * dt/1000;
      b.y += b.vy * dt/1000;
      if (b.y > H + 160 || b.x < -160 || b.x > W + 160) enemyBullets.splice(i,1);
      else {
        if (player.alive && performance.now() > player.invulnerableUntil && Math.hypot(player.x - b.x, player.y - b.y) < player.r + b.r) {
          // if shield active, consume
          if (player.power === 'shield' && performance.now() < player.poweredUntil) {
            // block and remove bullet
            enemyBullets.splice(i,1);
          } else {
            enemyBullets.splice(i,1);
            playerDie();
          }
        }
      }
    }

    // Update asteroids
    for (let i=asteroids.length-1;i>=0;i--) {
      const a = asteroids[i];
      a.y += a.vy * dt/1000 * globalSpeed;
      a.x += a.vx * dt/1000;
      a.rot += a.rotSpeed * dt/1000;
      // remove off-screen
      if (a.y > H + 240 || a.x < -240 || a.x > W + 240) asteroids.splice(i,1);
      else {
        // collision with player
        if (player.alive && performance.now() > player.invulnerableUntil && Math.hypot(player.x - a.x, player.y - a.y) < player.r + a.r) {
          if (player.power === 'shield' && performance.now() < player.poweredUntil) {
            // shield destroys asteroid
            fragmentAsteroid(i);
          } else {
            playerDie();
          }
        } else {
          // bullets vs asteroid (check simple distance then polygon approx)
          for (let j=bullets.length-1;j>=0;j--) {
            const b = bullets[j];
            const dx = b.x - a.x, dy = b.y - a.y;
            if (dx*dx + dy*dy <= (b.r + a.r)*(b.r + a.r)) {
              // hit - fragment
              bullets.splice(j,1);
              fragmentAsteroid(i); // remove and spawn fragments as needed
              break;
            }
          }
        }
      }
    }

    // Obstacles
    for (let i=obstacles.length-1;i>=0;i--) {
      const o = obstacles[i];
      o.y += o.vy * dt/1000 * globalSpeed;
      if (o.y > H + 200) obstacles.splice(i,1);
      else {
        // player vs obstacle (AABB)
        if (player.alive && performance.now() > player.invulnerableUntil) {
          if (player.x > o.x && player.x < o.x + o.w && player.y > o.y && player.y < o.y + o.h) {
            if (player.power === 'shield' && performance.now() < player.poweredUntil) {
              // shield — nothing (obstacle indestructible anyway)
            } else playerDie();
          }
        }
      }
    }

    // Powerups
    for (let i=powerups.length-1;i>=0;i--) {
      const p = powerups[i];
      p.y += p.vy * dt/1000;
      if (p.y > H + 80) powerups.splice(i,1);
      else {
        if (Math.hypot(player.x - p.x, player.y - p.y) < player.r + 18) {
          // collect
          player.power = p.type;
          player.poweredUntil = performance.now() + 60000; // 10s
          powerEl.textContent = p.type;
          powerups.splice(i,1);
        }
      }
    }
    // expire power
    if (player.power && performance.now() > player.poweredUntil) {
      player.power = null;
      powerEl.textContent = 'Ninguno';
    }

    // Machines update
    for (let i=machines.length-1;i>=0;i--) {
      const m = machines[i];
      // orbit-ish horizontal sway + descent
      m.x += Math.sin((elapsed + i)*0.6) * 90 * dt/1000;
      m.y += m.vy * dt/1000 * globalSpeed;
      m.shootTimer -= dt;
      if (m.shootTimer <= 0) {
        // shoot at player
        const dx = player.x - m.x, dy = player.y - m.y;
        const mag = Math.hypot(dx,dy) || 1;
        const sp = 300 + Math.random()*60;
        enemyBullets.push({ x: m.x, y: m.y, vx: dx/mag * sp, vy: dy/mag * sp, r:5 });
        m.shootTimer = rand(800,2200);
      }
      // offscreen removal
      if (m.y > H + 140) machines.splice(i,1);
      else {
        // collision with player
        if (player.alive && performance.now() > player.invulnerableUntil && Math.hypot(player.x - m.x, player.y - m.y) < player.r + m.r) {
          playerDie();
        }
        // bullets vs machine
        for (let j=bullets.length-1;j>=0;j--) {
          const b = bullets[j];
          if ((b.x - m.x)*(b.x - m.x) + (b.y - m.y)*(b.y - m.y) <= (b.r + m.r)*(b.r + m.r)) {
            bullets.splice(j,1);
            m.hp--;
            if (m.hp <= 0) {
              machines.splice(i,1);
              score += 20;
            }
            break;
          }
        }
      }
    }

    // Bosses update
    for (let bi=bosses.length-1;bi>=0;bi--) {
      const B = bosses[bi];
      // move in
      if (B.y < 140) B.y += B.vy * dt/1000;
      // lateral slow oscillation
      B.x = W/2 + Math.sin(elapsed * 0.5) * 160 * Math.min(1.5, 1 + bossesDefeated*0.02);
      // spawn machine minions every 5s
      B.machineTimer += dt;
      if (B.machineTimer >= 15000) {
        B.machineTimer = 0;
        for (let i=0;i<2;i++) spawnMachine();
      }
      // laser occasionally
      B.laserTimer += dt;
      if (B.laserTimer >= 7000 + Math.random()*4000) {
        B.laserTimer = 0;
        B.laserActive = true;
        B.laserEndTS = performance.now() + 700;
      }
      // small shoot
      B.shootTimer += dt;
      if (B.shootTimer >= 900) {
        B.shootTimer = 0;
        for (let k=-1;k<=1;k++){
          enemyBullets.push({ x: B.x + k*24, y: B.y + B.r, vx: k*40, vy: 300, r:6 });
        }
      }
      // laser active countdown
      if (B.laserActive && performance.now() > B.laserEndTS) B.laserActive = false;
      // bullets hitting boss
      for (let j=bullets.length-1;j>=0;j--) {
        const bl = bullets[j];
        if ((bl.x - B.x)*(bl.x - B.x) + (bl.y - B.y)*(bl.y - B.y) <= (bl.r + B.r)*(bl.r + B.r)) {
          bullets.splice(j,1);
          B.hp--;
          if (B.hp <= 0) {
            // boss died
            bosses.splice(bi,1);
            bossesDefeated++;
            bossCountEl.textContent = bossesDefeated;
            score += 200;
            globalSpeed *= 1.12;
            // reset counters so next boss after 60s
            elapsed = 0;
            bossSpawned = false;
            break;
          }
        }
      }
      // laser collision with player
      if (B.laserActive) {
        if (Math.abs(player.x - B.x) < 20 && performance.now() > player.invulnerableUntil) {
          if (player.power === 'shield' && performance.now() < player.poweredUntil) {
            // shield blocks
          } else playerDie();
        }
      }
    }
  }

  // Drawing functions (stylish vector look)
  function drawPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y);
    // slight tilt based on vx
    const tilt = clamp(player.vx / 400, -0.35, 0.35);
    ctx.rotate(tilt);

    // engine flame
    if (player.alive && (keys['w']||keys['s']||keys['a']||keys['d'])) {
      ctx.beginPath();
      ctx.moveTo(-6, 18);
      ctx.quadraticCurveTo(0, 26 + Math.random()*8, 6, 18);
      ctx.fillStyle = 'rgba(255,160,60,' + (0.6 + Math.random()*0.4) + ')';
      ctx.fill();
    }

    // body (complex)
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.lineTo(12, 8);
    ctx.quadraticCurveTo(4, 6, 0, 10);
    ctx.quadraticCurveTo(-4, 6, -12, 8);
    ctx.closePath();
    // glow stroke
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#9cf';
    ctx.shadowColor = '#9cf';
    ctx.shadowBlur = 10;
    ctx.stroke();
    ctx.fillStyle = '#0b2a3a';
    ctx.fill();

    // cockpit
    ctx.beginPath();
    ctx.arc(0, -6, 5, 0, Math.PI*2);
    ctx.fillStyle = '#3fd';
    ctx.fill();

    // shield if active
    if (player.power === 'shield' && performance.now() < player.poweredUntil) {
      ctx.beginPath();
      ctx.arc(0, 0, player.r+8, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(100,255,255,0.9)';
      ctx.lineWidth = 3;
      ctx.shadowColor = 'cyan';
      ctx.shadowBlur = 14;
      ctx.stroke();
    }

    ctx.restore();
    ctx.shadowBlur = 0;
  }

  function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);
    // fill rough
    ctx.beginPath();
    a.points.forEach((p,i) => i===0? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
    ctx.closePath();
    // fill + stroke
    ctx.fillStyle = '#5a4c3f';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#cdb69a';
    ctx.stroke();

    // small craters (procedural)
    for (let k=0;k<3;k++){
      const cx = a.points[k%a.points.length].x * 0.45;
      const cy = a.points[k%a.points.length].y * 0.45;
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(2, a.r*0.08), 0, Math.PI*2);
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fill();
    }
    ctx.restore();
  }

  function drawObstacle(o) {
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.fillStyle = '#3b3b3b';
    ctx.fillRect(0,0,o.w,o.h);
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#6b6b6b';
    ctx.strokeRect(0,0,o.w,o.h);
    ctx.restore();
  }

  function drawPowerUp(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(performance.now()/800);
    // diamond shape
    ctx.beginPath();
    ctx.moveTo(0, -12);
    ctx.lineTo(10, 0);
    ctx.lineTo(0, 12);
    ctx.lineTo(-10, 0);
    ctx.closePath();
    if (p.type === 'shield') {
      ctx.strokeStyle = '#6ff';
      ctx.fillStyle = 'rgba(100,255,255,0.06)';
    } else if (p.type === 'triple') {
      ctx.strokeStyle = '#ff8';
      ctx.fillStyle = 'rgba(255,200,80,0.06)';
    } else {
      ctx.strokeStyle = '#f6f';
      ctx.fillStyle = 'rgba(255,128,255,0.06)';
    }
    ctx.lineWidth = 2.5;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    ctx.shadowBlur = 0;
  }

  function drawMachine(m) {
    ctx.save();
    ctx.translate(m.x, m.y);
    // body hex-ish
    ctx.beginPath();
    ctx.moveTo(0,-12);
    ctx.lineTo(10,-6);
    ctx.lineTo(10,6);
    ctx.lineTo(0,12);
    ctx.lineTo(-10,6);
    ctx.lineTo(-10,-6);
    ctx.closePath();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#ff6666';
    ctx.shadowColor = '#ff6666';
    ctx.shadowBlur = 8;
    ctx.stroke();
    // hp bar
    ctx.fillStyle = '#222';
    ctx.fillRect(-m.r, m.r+8, m.r*2, 6);
    ctx.fillStyle = '#fddb7a';
    ctx.fillRect(-m.r, m.r+8, (m.hp/3)*(m.r*2), 6);
    ctx.restore();
    ctx.shadowBlur = 0;
  }

  function drawBoss(B) {
    ctx.save();
    ctx.translate(B.x, B.y);
    // main hull
    ctx.beginPath();
    ctx.moveTo(-72, -32);
    ctx.lineTo(72, -32);
    ctx.quadraticCurveTo(86, -32, 86, -16);
    ctx.lineTo(86, 16);
    ctx.quadraticCurveTo(86, 32, 72, 32);
    ctx.lineTo(-72, 32);
    ctx.quadraticCurveTo(-86, 32, -86, 16);
    ctx.lineTo(-86, -16);
    ctx.quadraticCurveTo(-86, -32, -72, -32);
    ctx.closePath();
    ctx.fillStyle = '#4b0f3a';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#d36fb3';
    ctx.shadowColor = '#d36fb3';
    ctx.shadowBlur = 18;
    ctx.stroke();

    // central eye
    ctx.beginPath();
    ctx.arc(0, -4, 20, 0, Math.PI*2);
    ctx.fillStyle = '#ff8';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -4, 10, 0, Math.PI*2);
    ctx.fillStyle = '#a00';
    ctx.fill();

    // HP bar above
    ctx.fillStyle = '#111';
    ctx.fillRect(-110, -56, 220, 10);
    ctx.fillStyle = '#2afc7a';
    ctx.fillRect(-110, -56, (B.hp/50)*220, 10);
    ctx.restore();
    ctx.shadowBlur = 0;

    // laser beam
    if (B.laserActive) {
      ctx.fillStyle = 'rgba(255,48,48,0.14)';
      ctx.fillRect(B.x - 22, 0, 44, H);
      ctx.fillStyle = 'rgba(255,160,160,0.95)';
      ctx.fillRect(B.x - 3, 0, 6, H);
    }
  }

  function drawBullets() {
    // player bullets
    ctx.fillStyle = '#dff';
    for (const b of bullets) {
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    }
    // enemy bullets
    ctx.fillStyle = '#ffb86b';
    for (const eb of enemyBullets) {
      ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI*2); ctx.fill();
    }
  }

  // draw loop
  function draw() {
    // clear background solid for performance
    ctx.fillStyle = '#02020a';
    ctx.fillRect(0,0,W,H);

    // stars
    for (let s of stars) {
      ctx.globalAlpha = clamp((s.z-0.2)/1.2, 0.2, 1);
      ctx.fillStyle = '#fff';
      ctx.fillRect(s.x, s.y, s.s, s.s);
    }
    ctx.globalAlpha = 1;

    // walls shading
    ctx.fillStyle = 'rgba(4,8,20,0.85)';
    ctx.fillRect(0,0,leftLimit, H);
    ctx.fillRect(rightLimit,0,W-rightLimit, H);
    // thin lines
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.beginPath();
    ctx.moveTo(leftLimit,0); ctx.lineTo(leftLimit,H);
    ctx.moveTo(rightLimit,0); ctx.lineTo(rightLimit,H);
    ctx.stroke();

    // obstacles
    for (const o of obstacles) drawObstacle(o);

    // asteroids
    for (const a of asteroids) drawAsteroid(a);

    // powerups
    for (const p of powerups) drawPowerUp(p);

    // machines
    for (const m of machines) drawMachine(m);

    // bosses
    for (const B of bosses) drawBoss(B);

    // bullets
    drawBullets();

    // player
    if (player.alive) drawPlayer();

    // HUD little hints: vertical limits
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(leftLimit-2, 0, 2, H);
    ctx.fillRect(rightLimit, 0, 2, H);
  }

  // main loop
  function loop(ts) {
  if (paused) return;

  const dt = ts - lastTS;
  lastTS = ts;

  update(dt);
  draw();

  if (running) requestAnimationFrame(loop);
}


  // initial small spawns for feel
  for (let i=0;i<3;i++) spawnAsteroid();

  // listen for spacebar press prevention on keypress
  window.addEventListener('keypress', (e)=> {
    if (e.code === 'Space' && running) e.preventDefault();
  });

  // expose simple debug spawn helpers (optional - comment out if not wanted)
  // window.spawnAsteroid = spawnAsteroid; window.spawnMachine = spawnMachine; window.spawnPowerup = spawnPowerup; window.spawnBoss = spawnBoss;

  // UI element shortcuts
  function updateUI() {
    livesEl.textContent = lives;
    scoreEl.textContent = Math.floor(score);
    timeEl.textContent = Math.floor(elapsed);
    powerEl.textContent = player.power ? player.power : 'Ninguno';
  }
  // update UI at a regular interval
  setInterval(updateUI, 200);

  // Start screen shown initially
  centerNotice.style.display = 'block';

})();
</script>
</body>
</html>
